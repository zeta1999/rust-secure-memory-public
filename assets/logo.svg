  <path d="M64 16 L104 33 L104 60 C104 85 85 105 64 112 C43 105 24 85 24 60 L24 33 Z"
        fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Lock body -->
  <rect x="48" y="62" width="32" height="26" rx="4" fill="url(#lockGrad)" stroke="#d97706" stroke-width="1.5"/>
  <!-- Lock shackle -->
  <path d="M52 62 L52 50 C52 40 76 40 76 50 L76 62"
        fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="64" cy="73" r="4" fill="#4f46e5"/>
  <rect x="62" y="73" width="4" height="8" rx="1" fill="#4f46e5"/>
  <!-- Quantum dots (representing lattice / post-quantum) -->
  <circle cx="34" cy="48" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="94" cy="48" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="40" cy="88" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="88" cy="88" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="64" cy="36" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="48" cy="100" r="1.5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="80" cy="100" r="1.5" fill="rgba(255,255,255,0.3)"/>
</svg>
